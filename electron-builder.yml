appId: ai.researchim.one-click-research-agent
# Keep this a single space-free slug: it drives the app name, the Linux install path
# (/opt/<productName>/) AND — historically — spaces in that /opt path crash Electron at
# startup (chrome-sandbox / resource resolution). executableName + a unified artifactName
# below guarantee the SAME space-free name across every platform and package format.
productName: one-click-research-agent
# One consistent, space-free filename for every target (AppImage/deb/tar.gz/exe/dmg/zip)
# instead of each installer inventing its own casing/separators.
artifactName: ${name}-${version}-${arch}.${ext}
copyright: Copyright © 2025-2026 researchim-ai

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*

# Ship the editable prompt templates to <resources>/prompts so both the main
# process and the agent worker can read (and users can override) them.
extraResources:
  - from: prompts
    to: prompts
    filter:
      - "**/*.md"

asar: true
asarUnpack:
  # The agent worker runs as a worker_thread loaded from app.asar.unpacked. Its module
  # resolution walks the REAL filesystem and never descends into app.asar, so any package it
  # require()s in-process (jsdom, mammoth, turndown, @mozilla/readability, node-pty) must live
  # on disk under app.asar.unpacked/node_modules — otherwise "Cannot find module 'mammoth'".
  # Unpacking all production node_modules is the robust fix (covers full transitive closure and
  # survives dependency changes); Electron still resolves them for the main process too.
  - "node_modules/**"
  # worker_threads use a vanilla Node module loader, so keep the worker entry on the real
  # filesystem; otherwise packaged builds silently lose the agent worker before the first request.
  - "dist-electron/agent-worker.js"

# Wrap the Linux executable so AppImage launches with --no-sandbox from process
# start (Chromium's setuid sandbox cannot be root:4755 inside the FUSE mount, and
# aborts before the JS entrypoint can append switches). deb/tar/dev are untouched.
afterPack: build/afterPack.cjs

linux:
  executableName: one-click-research-agent
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: tar.gz
      arch: [x64, arm64]
  maintainer: researchim-ai <noreply@researchim-ai.github.io>
  category: Development
  icon: build/icons
  synopsis: Local research agent powered by open-source models
  description: >-
    Fully local, self-contained research agent.
    Downloads and serves open-source models via llama.cpp.
    Investigates files, documents, repos, and reproducible workflows.
  desktop:
    Name: One-Click Research Agent
    StartupWMClass: one-click-research-agent

deb:
  # Restore the SUID bit on chrome-sandbox for .deb installs so the full Chromium
  # sandbox works (the /opt install path allows setuid, unlike the AppImage mount).
  afterInstall: build/deb-after-install.sh

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: build/icons/icon.icns
  category: public.app-category.developer-tools
  darkModeSupport: true
  hardenedRuntime: false
  gatekeeperAssess: false

win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]
  icon: build/icons/icon.ico

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: One-Click Research Agent

dmg:
  contents:
    - x: 410
      y: 150
      type: link
      path: /Applications
    - x: 130
      y: 150
      type: file

publish: null
